<svg xmlns="http://www.w3.org/2000/svg" width="680" height="320" viewBox="0 0 680 320" role="img" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title>What happens for each question</title>
<desc>For each question the script searches Neon, asks the model, checks the reply, scores it, then checks whether to stop. If not, it moves to the next question.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="320" rx="12" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="1"/>
<rect x="38" y="40" width="136" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="106.0" y="58" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#085041">Search Neon</text>
<text x="106.0" y="78" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">5 best chunks</text>
<rect x="194" y="40" width="136" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="262.0" y="58" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#085041">Ask the model</text>
<text x="262.0" y="78" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">gpt-4o-mini</text>
<rect x="350" y="40" width="136" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="418.0" y="58" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#085041">Check reply</text>
<text x="418.0" y="78" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">drop fake [n]</text>
<rect x="506" y="40" width="136" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="574.0" y="58" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#085041">Score it</text>
<text x="574.0" y="78" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">add up the cost</text>
<line x1="176" y1="68" x2="192" y2="68" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="332" y1="68" x2="348" y2="68" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="488" y1="68" x2="504" y2="68" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="480" y="150" width="160" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="560.0" y="168" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#444441">Stop check</text>
<text x="560.0" y="188" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">cap hit or key refused?</text>
<line x1="574" y1="98" x2="574" y2="148" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M478 178 H106 V98" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
<text x="292" y="166" text-anchor="middle" font-size="12" fill="#444441">no: next question</text>
<line x1="560" y1="208" x2="560" y2="248" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
<text x="572" y="230" text-anchor="start" font-size="12" fill="#444441">yes</text>
<rect x="480" y="250" width="160" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="560.0" y="268" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#444441">Stop the run</text>
<text x="560.0" y="288" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">prints the status</text>
</svg>
